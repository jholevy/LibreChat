version: 1.3.13

# Balance — gestion des seuils de tokens par rôle (Option A, 2026-07-30) #PImac
# LibreChat OSS n'a pas de balance native "par rôle" dans le yaml.
# Stratégie: startBalance = plafond USER (défaut nouveaux inscrits).
# Les ADMIN sont bumpés individuellement via Mongo (script role-balance-sync).
# Refill mensuel activé pour éviter le blocage définitif des users.
balance:
  enabled: true
  startBalance: 500000        # plafond USER par défaut (nouveaux inscrits)
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 250000         # recharge mensuelle USER

endpoints:
  custom:
    # Claude via endpoint natif Anthropic (provider: anthropic) — modèles à jour 2026. #PImac
    # Remplace l'endpoint Anthropic natif désactivé (ENDPOINTS=agents,custom) qui avait une liste figée vieille.
    - name: "Claude"
      provider: "anthropic"
      apiKey: "${ANTHROPIC_API_KEY}"
      baseURL: "https://api.anthropic.com"
      headers:
        anthropic-version: "2023-06-01"
      models:
        default:
          - "claude-opus-5"
          - "claude-sonnet-5"
          - "claude-opus-4-8"
          - "claude-fable-5"
          - "claude-haiku-4-5"
          - "claude-sonnet-4-6"
        fetch: false
      titleConvo: true
      titleModel: "claude-haiku-4-5"
      modelDisplayLabel: "Claude"

    # Z.AI — GLM via abonnement Lite (endpoint coding/paas, pas le solde API). #PImac
    - name: "ZAI"
      apiKey: "${ZAI_API_KEY}"
      baseURL: "https://api.z.ai/api/coding/paas/v4"
      models:
        default:
          - "glm-5.1"
          - "glm-5"
          - "glm-5-turbo"
          - "glm-4.7"
          - "glm-4.7-flash"
        fetch: false
      titleConvo: true
      titleModel: "glm-4.7-flash"
      modelDisplayLabel: "GLM"

    - name: "Ollama Local"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1"
      models:
        default:
          - "qwen2.5:14b"
          - "llama3.2:3b-instruct-q4_K_M"
          - "mistral:7b-instruct-q5_K_M"
          - "mistral-small3.2:latest"
          - "llama3.1:8b-instruct-q5_K_M"
          - "qwen2.5:7b-instruct-q5_K_M"
          - "qwen3-coder:30b"
      title: "Ollama (Local)"
      modelDisplayLabel: "Ollama"
      
    - name: "TurboQuant Local"
      apiKey: "turboquant"
      baseURL: "http://host.docker.internal:8080/v1"
      models:
        default:
          - "Qwen2.5-14B-Instruct-Q4_K_M.gguf"
          - "Qwen3-14B-Q4_K_M.gguf"
      title: "TurboQuant (Local)"
      modelDisplayLabel: "TurboQuant"

    - name: "Mistral"
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "https://api.mistral.ai/v1"
      models:
        default:
          - "mistral-large-latest"
          - "mistral-small-latest"
          - "codestral-latest"
          - "open-mixtral-8x22b"
      fetch: false
      title: "Mistral AI"
      modelDisplayLabel: "Mistral"

    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
      fetch: false
      title: "DeepSeek"
      modelDisplayLabel: "DeepSeek"

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_API_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "anthropic/claude-opus-5"
          - "anthropic/claude-sonnet-5"
          - "openai/gpt-5.1"
          - "openai/gpt-5"
          - "google/gemini-3.1-pro-preview"
          - "google/gemini-3.5-flash"
          - "x-ai/grok-4.5"
          - "qwen/qwen3-235b-a22b"
        fetch: true
      title: "OpenRouter"
      modelDisplayLabel: "OpenRouter"
